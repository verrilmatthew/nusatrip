<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NusaTrip — Offline</title><style>body{font:16px/1.6 system-ui;margin:0;background:#f8f9f6;color:#203b38}main{max-width:850px;margin:auto;padding:28px}h1{color:#14675e}section{background:white;border:1px solid #dce5de;border-radius:16px;padding:20px;margin:18px 0}li{padding:9px 0}small{color:#61726c}button{background:#14675e;color:white;border:0;border-radius:10px;padding:12px 20px;font:inherit}</style><main><h1>NusaTrip · offline</h1><p>Rencana tersimpan, bisa dibaca saat tidak ada koneksi. Data mungkin kedaluwarsa. Peta dan perubahan memerlukan internet.</p><button onclick="location.reload()">Coba hubungkan kembali</button><div id="content"></div></main><script>
const root=document.getElementById('content');function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}try{const t=JSON.parse(localStorage.getItem('nusatrip-offline'));if(!t)throw Error();root.append(el('h2',t.title),el('small','Terakhir disimpan '+new Date(t.saved).toLocaleString('id-ID')),el('p','Budget grup '+new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(t.budget.total)));for(const d of t.days){const section=el('section','');section.append(el('h2',d.date+' · '+d.city));const ul=el('ul','');for(const x of d.items)ul.append(el('li',x.start+'–'+x.end+' · '+x.title+' · '+x.area));section.append(ul);root.append(section)}const section=el('section','');section.append(el('h2','Checklist (baca saja)'));for(const c of t.checklist)section.append(el('p',(c.done?'✓ ':'○ ')+c.name+' × '+c.quantity));root.append(section)}catch{root.append(el('p','Belum ada perjalanan yang tersimpan untuk akses offline. Buka trip saat online terlebih dahulu.'))}
</script></html>
